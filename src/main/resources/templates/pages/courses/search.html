<div th:fragment="search-content" class="search-container">
    <!-- Блок для flash-сообщений -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <h1 th:text="${title}">Поиск курсов</h1>

    <!-- Форма поиска -->
    <form th:action="@{/courses/search}" method="get" class="search-form">
        <div class="search-input-group">
            <input type="text" name="title" th:value="${searchTitle}"
                   placeholder="Название или описание курса..." class="search-input">
            <button type="submit" class="search-btn"><i class="fas fa-search"></i> Найти</button>
        </div>
    </form>

    <!-- Результаты -->
    <div th:if="${searchTitle != null}" class="search-results">
        <div th:if="${#lists.isEmpty(courses)}" class="alert alert-info">
            <i class="fas fa-info-circle"></i> По запросу «<strong th:text="${searchTitle}"></strong>» ничего не найдено.
        </div>
        <div th:unless="${#lists.isEmpty(courses)}">
            <p class="results-count">Найдено курсов: <strong th:text="${#lists.size(courses)}"></strong></p>
            <div class="courses-grid">
                <div th:each="course : ${courses}" class="course-card">
                    <a th:href="@{/courses/{id}(id=${course.id})}">
                    <img th:if="${course.imageUrl}" th:src="@{${course.imageUrl}}" alt="Изображение" class="course-image"></a>
                    <div class="course-info"  >
                        <h3><a th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.title}">Название</a></h3>
                        <p class="course-description" th:text="${course.description}">Описание</p>
                        <div class="course-meta">
                            <span class="instructor"><i class="fas fa-user"></i> <span th:text="${course.author}">Автор</span></span>
                            <span class="price" th:if="${course.price != 0 and course.price != null}"><i class="fas fa-tag"></i> <span th:text="${course.price}"></span> ₽</span>
                        </div>

                        <form th:action="@{/cart/add/{id}(id=${course.id})}" method="post" th:unless="${purchased}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button  type="submit" class="btn-add-to-cart">
                                <i class="fas fa-shopping-cart"></i> В корзину
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Пагинация -->
            <div th:if="${totalPages != null and totalPages > 1}" class="pagination">
                <a th:if="${currentPage > 0}" th:href="@{/search(title=${searchTitle}, page=${currentPage - 1})}" class="page-link">← Назад</a>
                <span class="page-current">Страница <span th:text="${currentPage + 1}"></span> из <span th:text="${totalPages}"></span></span>
                <a th:if="${currentPage + 1 < totalPages}" th:href="@{/search(title=${searchTitle}, page=${currentPage + 1})}" class="page-link">Вперёд →</a>
            </div>
        </div>
    </div>

    <!-- Подсказка при первом заходе -->
    <div th:if="${searchTitle == null}" class="welcome-message">
        <i class="fas fa-lightbulb"></i> Введите ключевое слово, чтобы найти курсы.
    </div>
</div>
